bundle:
  name: customer-churn-platform

targets:

  dev:
    mode: development
    workspace:
      host: https://adb-xxxxx.azuredatabricks.net

  prod:
    mode: production
    workspace:
      host: https://adb-xxxxx.azuredatabricks.net

resources:

  jobs:

    churn_pipeline:

      name: Customer Churn Pipeline

      tasks:

        - task_key: bronze
          notebook_task:
            notebook_path: src/bronze/bronze_pipeline

        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: src/silver/silver_pipeline

        - task_key: gold
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: src/gold/gold_pipeline

        - task_key: train_model
          depends_on:
            - task_key: gold
          notebook_task:
            notebook_path: src/ml/train_model

        - task_key: batch_score
          depends_on:
            - task_key: train_model
          notebook_task:
            notebook_path: src/ml/batch_score
